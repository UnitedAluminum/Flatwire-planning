<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>FL1 die change · FW-00421</title>
<link rel="stylesheet" href="flat-wire-shopfloor.styles.css">
<!--
  ============================================================================
  DIE CHANGE IS A DIALOG, NOT A SCREEN (converted 1 Aug 2026)
  ============================================================================
  The screen this file used to hold now lives in die_change.js and opens as a
  popup over the paused run it is logging against.

  It gained one thing in the move: when the reason is gauge drift or size change
  and "Require SPC on resume" is left on, confirming the change now opens the SPC
  checkpoint dialog directly, pre-loaded with this die change as its trigger. The
  spec always said the two were linked — the SPC screen's trigger banner is
  literally a die change — but as separate pages nothing could carry it across.

  Die change belongs to FL1 and FL3 only. FL2 finishes pre-flattened spool and has
  no draw boxes, so its active-run monitor deliberately does not load this dialog.

  This file is kept as a LAUNCHER so the references to the filename across the
  master specification, the SRS and the phase plans keep resolving, and so a
  reviewer can still open the screen on its own.
  ============================================================================
-->
<style>
  .dashboard { min-height: 1024px; justify-content: center; align-items: center; }
  .launcher {
    max-width: 640px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 34px 40px;
  }
  .launcher-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--color-background-info);
    color: var(--color-blue);
    display: flex; align-items: center; justify-content: center;
  }
  .launcher-icon svg { width: 30px; height: 30px; }
  .launcher h1 { margin: 0; font-size: 22px; font-weight: 500; }
  .launcher p { margin: 0; font-size: 14px; color: var(--color-text-secondary); line-height: 1.5; }
  .launcher-btn {
    height: 48px; padding: 0 26px;
    font-size: 14px; font-weight: 500; font-family: var(--font-sans);
    border: 1px solid var(--color-blue);
    background: var(--color-blue);
    color: #fff;
    border-radius: var(--border-radius-md);
    cursor: pointer;
    margin-top: 4px;
  }
  .launcher-btn:hover { background: #13497d; }
</style>
</head>
<body>
<div class="dashboard">
  <div class="launcher panel">
    <span class="launcher-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
    </span>
    <h1>Die change</h1>
    <p>
      This is now a dialog rather than a screen, so the change is logged against the
      paused run without leaving it — and a gauge-drift or size change hands straight
      over to the SPC checkpoint it makes mandatory.
    </p>
    <button class="launcher-btn" type="button" onclick="launch()">Open the die change dialog</button>
  </div>
</div>

<script>
  function launch() {
    window.openDieChange({
      line: "FL1",
      orderNo: "FW-00421",
      block: "DB2",
      footage: "12,450 ft",
      outputCoil: "FW-00421-C01",
      operator: "Dave M."
    });
  }
  window.addEventListener("load", launch);
</script>

<script src="fw-modal.js"></script>
<script src="die_change.js"></script>
<script src="spc_checkpoint.js"></script>
<script src="wip_rejection.js"></script>
<script src="flat-wire-topbar.js"></script>
<script src="flat-wire-fit.js" data-fit="fill"></script>
</body>
</html>

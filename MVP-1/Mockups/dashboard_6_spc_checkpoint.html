<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>SPC Checkpoint · FL1 · FW-00421</title>
<link rel="stylesheet" href="flat-wire-shopfloor.styles.css">
<!--
  ============================================================================
  SPC CHECKPOINT IS A DIALOG, NOT A SCREEN (converted 1 Aug 2026)
  ============================================================================
  The screen this file used to hold now lives in spc_checkpoint.js and opens as a
  popup over the run it is measuring.

  Two things that were impossible while it was a page now work:
    · the trigger banner ("DB2 die change · 0.310" → 0.308" · at 12,450 ft") is
      real data handed over by the die change dialog, not a hard-coded string;
    · "Submit · suspend material" chains straight into the WIP rejection dialog
      with the failing reading already filled in.

  It also has a READ-ONLY mode, for the line status board's "SPC · Last check
  07:38 AM · In spec · View →" link. That link reviews a checkpoint that has
  already been recorded; opening a blank entry form there was simply wrong.

  This file is kept as a LAUNCHER so the references to the filename across the
  master specification, the SRS and the phase plans keep resolving, and so a
  reviewer can still open the screen on its own.
  ============================================================================
-->
<style>
  .dashboard { min-height: 1024px; justify-content: center; align-items: center; }
  .launcher {
    max-width: 640px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 34px 40px;
  }
  .launcher-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--color-background-success);
    color: var(--color-green);
    display: flex; align-items: center; justify-content: center;
  }
  .launcher-icon svg { width: 30px; height: 30px; }
  .launcher h1 { margin: 0; font-size: 22px; font-weight: 500; }
  .launcher p { margin: 0; font-size: 14px; color: var(--color-text-secondary); line-height: 1.5; }
  .launcher-actions { display: flex; gap: 10px; margin-top: 4px; }
  .launcher-btn {
    height: 48px; padding: 0 24px;
    font-size: 14px; font-weight: 500; font-family: var(--font-sans);
    border: 1px solid var(--color-green);
    background: var(--color-green);
    color: #fff;
    border-radius: var(--border-radius-md);
    cursor: pointer;
  }
  .launcher-btn:hover { background: #168962; }
  .launcher-btn.secondary {
    background: var(--color-background-primary);
    border-color: var(--color-border-secondary);
    color: var(--color-text-primary);
  }
  .launcher-btn.secondary:hover { background: var(--color-background-secondary); }
</style>
</head>
<body>
<div class="dashboard">
  <div class="launcher panel">
    <span class="launcher-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </span>
    <h1>SPC Checkpoint</h1>
    <p>
      This is now a dialog rather than a screen, so a checkpoint is taken over the
      run it measures and can hand a failing reading straight to a WIP rejection.
      It has opened over this page in the post-die-change case.
    </p>
    <div class="launcher-actions">
      <button class="launcher-btn" type="button" onclick="launch()">Open the checkpoint dialog</button>
      <button class="launcher-btn secondary" type="button" onclick="launchReadOnly()">Open a recorded checkpoint</button>
    </div>
  </div>
</div>

<script>
  function launch() {
    window.openSpcCheckpoint({
      line: "FL1",
      orderNo: "FW-00421",
      alpha: "R00042",
      checkpointType: "post-die-change",
      footage: "12,450 ft",
      operator: "Dave M.",
      trigger: {
        kind: "die-change", block: "DB2",
        from: '0.310"', to: '0.308"',
        footage: "12,450 ft", by: "Tim O.", at: "07:38 AM"
      }
    });
  }

  /* The line status board's "View →" path — a checkpoint already recorded. */
  function launchReadOnly() {
    window.openSpcCheckpoint({
      line: "FL1",
      orderNo: "FW-00421",
      alpha: "R00042",
      checkpointType: "spot-check",
      footage: "12,450 ft",
      operator: "Dave M.",
      recordedAt: "07:38:04 AM · Apr 23, 2026",
      observation: "Surface clean after the swap; no pickup on the roll face.",
      readOnly: true
    });
  }

  window.addEventListener("load", launch);
</script>

<script src="fw-modal.js"></script>
<script src="spc_checkpoint.js"></script>
<script src="wip_rejection.js"></script>
<script src="flat-wire-topbar.js"></script>
<script src="flat-wire-fit.js" data-fit="fill"></script>
</body>
</html>
